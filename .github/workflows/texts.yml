name: Texts

# The mod itself cannot be built here: it compiles against the game's own DLLs, which are not in the repository.
# This checks what can be checked without them: that the text file is valid and has no key twice.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  en-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: en.json is valid and has no duplicate keys
        run: |
          python3 - <<'EOF'
          import json, sys
          path = "Assets/Mods/RealLifeOverhaul/Locales/en.json"
          seen, twice = set(), []
          def pairs(items):
              for key, _ in items:
                  if key in seen:
                      twice.append(key)
                  seen.add(key)
              return dict(items)
          with open(path, encoding="utf-8-sig") as f:
              json.load(f, object_pairs_hook=pairs)
          bad = [c for c in ("—", "–", "…") if c in open(path, encoding="utf-8-sig").read()]
          if twice:
              print("Keys that appear twice:", ", ".join(twice[:20])); sys.exit(1)
          if bad:
              print("The texts contain an em dash, an en dash or an ellipsis character."); sys.exit(1)
          print(len(seen), "keys, none twice")
          EOF
